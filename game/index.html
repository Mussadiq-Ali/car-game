<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="header-section">
            <h1>SPEED RACER</h1>
            <p>Avoid the traffic</p>
        </div>

        <div class="scoreboard">
            <div class="score-item">
                <span class="label">SCORE</span>
                <span class="value">0000</span>
            </div>
            <div class="score-item">
                <span class="label">SPEED</span>
                <span class="value">120 KM/H</span>
            </div>
            <div class="score-item">
                <span class="label">LEVEL</span>
                <span class="value">1</span>
            </div>
        </div>

        <div class="road">
            <div class="road-line line1"></div>
            <div class="road-line line2"></div>

            <div class="enemy enemy1">🚘</div>
            <div class="enemy enemy2">🚓</div>

            <div class="player">🏎️</div>
        </div>


        <div class="instructions">
            <p>Avoid the cars</p>
        </div>

        <button class="start-btn">START RACE</button>
    </div>

</body>
</html>
